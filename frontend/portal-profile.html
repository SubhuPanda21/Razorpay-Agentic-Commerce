<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><title>Profile — SpendRail</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
:root{--ink:#1c1a17;--paper:#faf6ef;--accent:#d9772e;--line:#e7ddcd}
*{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,Segoe UI,sans-serif;display:flex;min-height:100vh}
.sidebar{width:220px;border-right:1px solid var(--line);padding:26px 18px;flex-shrink:0}
.sidebar .logo{font-family:Georgia,serif;font-size:19px;display:block;margin-bottom:30px;text-decoration:none;color:var(--ink)}
.sidebar a{display:block;padding:10px 12px;border-radius:8px;color:#6b6459;text-decoration:none;font-size:14px;margin-bottom:2px}
.sidebar a.active{background:#fff;color:var(--ink);font-weight:600;border:1px solid var(--line)}
main{flex:1;padding:40px;max-width:500px}
h1{font-family:Georgia,serif;font-size:28px;margin:0 0 20px}
label{font-size:12px;color:#8a8272;display:block;margin:16px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid #d8cfc0;border-radius:8px;font-size:14px;font-family:inherit}
textarea{min-height:80px}
button{background:var(--accent);color:#fff;border:0;padding:11px 20px;border-radius:8px;font-weight:600;margin-top:20px;cursor:pointer}
</style></head>
<body>
<div class="sidebar">
  <a href="/" class="logo">Spend<span style="color:var(--accent)">Rail</span></a>
  <a href="/portal/dashboard">Dashboard</a>
  <a href="/#play" target="_blank">Playground</a>
  <a href="/portal/api-keys">API Keys</a>
  <a href="/docs" target="_blank">API Docs</a>
  <a href="/about">About</a>
  <a href="/portal/profile" class="active">Profile</a>
  <a href="#" id="logout">Logout</a>
</div>
<main>
  <h1>Profile</h1>
  <form id="f">
    <label>Display name</label><input name="display_name">
    <label>Organization</label><input name="organization">
    <label>Role</label><input name="role">
    <label>What are you building?</label><textarea name="building_description"></textarea>
    <button type="submit">Save changes</button>
  </form>
</main>
<script>
fetch('/auth/me').then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(d=>{
  const f = document.getElementById('f');
  f.display_name.value = d.display_name || '';
  f.organization.value = d.organization || '';
  f.role.value = d.role || '';
  f.building_description.value = d.building_description || '';
}).catch(()=>window.location.href='/signin');
document.getElementById('f').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const f = new FormData(e.target);
  await fetch('/auth/onboarding', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.fromEntries(f))});
  alert('Saved.');
});
document.getElementById('logout').addEventListener('click', async (e)=>{
  e.preventDefault(); await fetch('/auth/logout', {method:'POST'}); window.location.href = '/';
});
</script>
</body></html>
